name: Market workspace checks
on:
  pull_request:
    paths:
      - 'BTCandThings_Website/BTCandThings_Upload/market_workspace.py'
      - 'BTCandThings_Website/BTCandThings_Upload/market_board.py'
      - 'BTCandThings_Website/BTCandThings_Upload/app.py'
      - 'tools/test_market_workspace.py'
      - '.github/workflows/market-workspace-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install pandas
      - name: Syntax and route validation
        run: |
          python -m py_compile BTCandThings_Website/BTCandThings_Upload/app.py BTCandThings_Website/BTCandThings_Upload/market_workspace.py BTCandThings_Website/BTCandThings_Upload/market_board.py
          python -m unittest discover -s tools -p 'test_market_workspace.py' -v
          python -m unittest discover -s tools -p 'test_market_board.py' -v
