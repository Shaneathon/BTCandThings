name: TBot paper checks
on:
  push:
    branches: ['bot/paper-trading-terminal']
  pull_request:
    paths:
      - 'trading_bot/**'
      - '.github/workflows/tbot-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r trading_bot/requirements.txt
      - run: python -m unittest discover -s trading_bot/tests -v
      - run: python trading_bot/smoke_ui.py
