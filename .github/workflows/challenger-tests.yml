name: Challenger research offline tests
on:
  pull_request:
    paths:
      - 'tools/challenger_research.py'
      - 'tools/test_challenger_research.py'
      - '.github/workflows/challenger-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: |
          python -m py_compile tools/challenger_research.py
          python -m unittest discover -s tools -p 'test_challenger_research.py' -v
