name: Ten-stream preparation checks
on:
  push:
    branches: ['research/ten-stream-setup']
  pull_request:
    paths:
      - 'collection/**'
      - 'deploy/**'
      - 'BTCandThings_Website/BTCandThings_Upload/**'
      - 'tools/**'
      - '.github/workflows/ten-stream-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.1,<3' 'streamlit==1.51.0'
      - name: Collector, pipeline and website unit tests
        run: |
          python -m unittest discover -s collection -v
          python -m unittest discover -s tools -v
      - name: Fixture UI and shell validation
        run: |
          python tools/smoke_tracker_ui.py
          bash -n deploy/install-research.sh deploy/validate-research.sh deploy/stop-research.sh
