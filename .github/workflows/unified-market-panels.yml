name: Unified market panels offline checks
on:
  pull_request:
    paths:
      - 'BTCandThings_Website/BTCandThings_Upload/market_candles.py'
      - 'BTCandThings_Website/BTCandThings_Upload/market_workspace.py'
      - 'BTCandThings_Website/BTCandThings_Upload/app.py'
      - 'tools/test_unified_candles.py'
      - '.github/workflows/unified-market-panels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pandas
      - name: Check syntax and offline data logic
        run: |
          python -m py_compile BTCandThings_Website/BTCandThings_Upload/app.py BTCandThings_Website/BTCandThings_Upload/market_workspace.py BTCandThings_Website/BTCandThings_Upload/market_candles.py
          python -m unittest discover -s tools -p 'test_unified_candles.py' -v
          python -m unittest discover -s tools -p 'test_market_workspace.py' -v
          python -m unittest discover -s tools -p 'test_market_board.py' -v
